name: standalone-discovery

services:
  # ── AmneziaWG VPN — общий сетевой namespace для discovery-api ──
  # Собран из официальных исходников amnezia-vpn (amneziawg-go + amneziawg-tools),
  # userspace-реализация — без ядерного модуля wireguard.
  # Заменил linuxserver/wireguard 2026-08-07: провайдер выдаёт один peer на пару
  # ключей, второй клиент с тем же конфигом (n8n-vpn-1) держал handshake мёртвым
  # 13 дней (roaming-конфликт). Теперь у каждого сервера свой отдельный peer.
  vpn:
    build:
      context: ./amneziawg-client
    container_name: standalone-discovery-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - TZ=${TZ:-Europe/Moscow}
      # СПЛИТ-ТУННЕЛЬ настраивается НЕ здесь, а в секции [Peer] файла
      # ./Telegram-Parser-Gleb-2.conf через поле AllowedIPs.
      # Чтобы через VPN шёл ТОЛЬКО Telegram, в .conf указаны подсети Telegram:
      #   AllowedIPs = 149.154.160.0/20, 91.108.4.0/22, 91.108.8.0/22, 91.108.56.0/22, ...
      # Полное туннелирование (всё через VPN): AllowedIPs = 0.0.0.0/0
    volumes:
      - ./Telegram-Parser-Gleb-2.conf:/config/wg_confs/wg0.conf:ro
    ports:
      - "${DISCOVERY_APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "awg show wg0 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  discovery-api:
    build:
      context: ..
      dockerfile: standalone_discovery/Dockerfile.pg-queue
    image: standalone-discovery-api:latest
    container_name: standalone-discovery-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      CLIENT_SESSIONS_DIR: /app/client-sessions
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - ./data:/app/discovery_api/data
      - ./sessions:/app/sessions
      - ./client-sessions:/app/client-sessions
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
